server:
  port: 3000
  servlet:
    context-path: /

spring:
  application:
    name: backend
  config:
    # Le backend/.env (fora do git) rodando a partir de backend/ ou da raiz do repositorio.
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:takehub}
    username: ${DB_USER:takehub}
    password: ${DB_PASSWORD:takehub}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

takehub:
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:takehub-tcc-dev-secret-troque-em-producao-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
