services:
  postgres:
    image: postgres:16-alpine
    container_name: takehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: takehub
      POSTGRES_USER: takehub
      POSTGRES_PASSWORD: takehub
    ports:
      - "5432:5432"
    volumes:
      - takehub-postgres-data:/var/lib/postgresql/data

volumes:
  takehub-postgres-data:
