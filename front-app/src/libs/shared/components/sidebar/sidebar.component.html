<aside
  class="sidebar"
  [class.collapsed]="effectiveCollapsed"
  [class.cliente]="isCliente"
  [class.floating]="!isCliente"
  (mouseenter)="hovering = true"
  (mouseleave)="hovering = false"
>
  <div class="brand" (click)="onBrandClick()">
    <div class="logo-icon">
      <mat-icon>play_circle</mat-icon>
    </div>
    <div class="logo-text" *ngIf="!effectiveCollapsed">
      <span class="logo-name">TakeHub</span>
      <span class="logo-sub">{{ logoSubtitulo }}</span>
    </div>
  </div>

  <!-- Modo cliente: perfil no topo + contexto do projeto -->
  <ng-container *ngIf="isCliente">
    <div class="profile top" [class.open]="menuOpen" [class.collapsed]="effectiveCollapsed">
      <div class="profile-menu" role="menu">
        <button class="profile-menu-item" type="button" role="menuitem" (click)="irParaMinhaConta()">
          <mat-icon>account_circle</mat-icon>
          <span>Minha conta</span>
        </button>
        <button class="profile-menu-item danger" type="button" role="menuitem" (click)="sair()">
          <mat-icon>logout</mat-icon>
          <span>Sair da conta</span>
        </button>
      </div>

      <button
        class="profile-trigger"
        type="button"
        (click)="menuOpen = !menuOpen"
        [matTooltip]="effectiveCollapsed ? nomeExibido : ''"
        matTooltipPosition="right"
      >
        <div class="avatar">{{ iniciais }}</div>
        <div class="profile-info" *ngIf="!effectiveCollapsed">
          <span class="profile-name">{{ nomeExibido }}</span>
          <span class="profile-role">{{ contatoExibido }}</span>
        </div>
        <mat-icon class="chevron" *ngIf="!effectiveCollapsed">expand_more</mat-icon>
      </button>
    </div>

    <div class="client-context" *ngIf="!effectiveCollapsed">
      <div class="context-block" *ngIf="empresa">
        <span class="context-label">Empresa</span>
        <span class="context-value">{{ empresa }}</span>
      </div>

      <div class="projeto-box" *ngIf="projeto">
        <span class="context-label">Projeto</span>
        <span class="projeto-nome">{{ projeto.nome }}</span>
        <div class="projeto-badges">
          <span class="badge">{{ projeto.versao }}</span>
          <span class="badge status" [ngClass]="projeto.statusTipo">
            <mat-icon>{{ statusIcon }}</mat-icon>
            {{ projeto.statusLabel }}
          </span>
        </div>
      </div>
    </div>

    <div class="nav-spacer"></div>

    <button
      class="sair-link"
      type="button"
      (click)="sair()"
      [matTooltip]="effectiveCollapsed ? 'Sair' : ''"
      matTooltipPosition="right"
    >
      <mat-icon>logout</mat-icon>
      <span *ngIf="!effectiveCollapsed">Sair</span>
    </button>
  </ng-container>

  <!-- Modo interno: navegação + perfil no rodapé -->
  <ng-container *ngIf="!isCliente">
    <nav class="nav">
      <button
        *ngFor="let item of navItems"
        class="nav-item"
        [class.active]="isActive(item.route)"
        (click)="navigate(item.route)"
        [matTooltip]="effectiveCollapsed ? item.label : ''"
        matTooltipPosition="right"
      >
        <mat-icon>{{ item.icon }}</mat-icon>
        <span *ngIf="!effectiveCollapsed">{{ item.label }}</span>
      </button>
    </nav>

    <div class="profile" [class.open]="menuOpen" [class.collapsed]="effectiveCollapsed">
      <div class="profile-menu" role="menu">
        <button class="profile-menu-item" type="button" role="menuitem" (click)="irParaMinhaConta()">
          <mat-icon>account_circle</mat-icon>
          <span>Minha conta</span>
        </button>
        <button class="profile-menu-item danger" type="button" role="menuitem" (click)="sair()">
          <mat-icon>logout</mat-icon>
          <span>Sair da conta</span>
        </button>
      </div>

      <button
        class="profile-trigger"
        type="button"
        (click)="menuOpen = !menuOpen"
        [matTooltip]="effectiveCollapsed ? (nomeExibido || 'Conta') : ''"
        matTooltipPosition="right"
      >
        <div class="avatar">{{ iniciais }}</div>
        <div class="profile-info" *ngIf="!effectiveCollapsed">
          <span class="profile-name">{{ nomeExibido }}</span>
          <span class="profile-role">{{ contatoExibido }}</span>
        </div>
        <mat-icon class="chevron" *ngIf="!effectiveCollapsed">expand_less</mat-icon>
      </button>
    </div>
  </ng-container>
</aside>
