<aside class="sidebar" [class.collapsed]="collapsed">
  <div class="brand" (click)="toggleSidebar.emit()">
    <div class="logo-icon">
      <mat-icon>play_circle</mat-icon>
    </div>
    <div class="logo-text" *ngIf="!collapsed">
      <span class="logo-name">TakeHub</span>
      <span class="logo-sub">Gestão de Edição</span>
    </div>
  </div>

  <nav class="nav">
    <button
      *ngFor="let item of navItems"
      class="nav-item"
      [class.active]="isActive(item.route)"
      (click)="navigate(item.route)"
      [matTooltip]="collapsed ? item.label : ''"
      matTooltipPosition="right"
    >
      <mat-icon>{{ item.icon }}</mat-icon>
      <span *ngIf="!collapsed">{{ item.label }}</span>
    </button>
  </nav>

  <div class="profile" [class.open]="menuOpen" [class.collapsed]="collapsed">
    <div class="profile-menu" role="menu">
      <button class="profile-menu-item" type="button" role="menuitem" (click)="irParaMinhaConta()">
        <mat-icon>account_circle</mat-icon>
        <span>Minha conta</span>
      </button>
      <button class="profile-menu-item danger" type="button" role="menuitem" (click)="sair()">
        <mat-icon>logout</mat-icon>
        <span>Sair da conta</span>
      </button>
    </div>

    <button
      class="profile-trigger"
      type="button"
      (click)="menuOpen = !menuOpen"
      [matTooltip]="collapsed ? (user?.nome || 'Conta') : ''"
      matTooltipPosition="right"
    >
      <div class="avatar">{{ iniciais }}</div>
      <div class="profile-info" *ngIf="!collapsed">
        <span class="profile-name">{{ user?.nome }}</span>
        <span class="profile-role">{{ user?.cargo }}</span>
      </div>
      <mat-icon class="chevron" *ngIf="!collapsed">expand_less</mat-icon>
    </button>
  </div>
</aside>
