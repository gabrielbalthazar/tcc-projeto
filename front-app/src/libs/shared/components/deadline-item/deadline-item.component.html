<div class="item">
  <div class="info">
    <span class="nome">{{ prazo.nome }}</span>
    <span class="cliente">{{ prazo.cliente }}</span>
  </div>
  <span class="status" [ngClass]="prazo.diasRestantes < 0 ? 'atrasado' : 'proximo'">
    {{ prazo.diasRestantes < 0 ? 'Atrasado!' : prazo.diasRestantes + 'd restantes' }}
  </span>
</div>
