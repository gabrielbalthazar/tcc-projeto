<div class="field" [class.has-error]="hasError" [class.disabled]="disabled">
  <label *ngIf="label" [attr.for]="inputId">{{ label }}</label>

  <div class="control" [class.textarea]="type === 'textarea'">
    <mat-icon class="prefix" *ngIf="prefixIcon && type !== 'textarea'">{{ prefixIcon }}</mat-icon>

    <textarea
      *ngIf="type === 'textarea'"
      [id]="inputId"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [attr.maxlength]="maxLength || null"
      [attr.aria-invalid]="hasError"
      [value]="value"
      (input)="onInput($event)"
      (blur)="onBlur()"
      [rows]="rows"
    ></textarea>

    <input
      *ngIf="type !== 'textarea'"
      [id]="inputId"
      [type]="resolvedType"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [attr.maxlength]="maxLength || null"
      [attr.aria-invalid]="hasError"
      [value]="value"
      (input)="onInput($event)"
      (blur)="onBlur()"
    />

    <!--botão mostrar senha-->
    <button
      *ngIf="type === 'password'"
      class="suffix-btn"
      type="button"
      [attr.aria-label]="showPassword ? 'Ocultar senha' : 'Mostrar senha'"
      (click)="showPassword = !showPassword"
    >
      <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
    </button>
  </div>

  <!--validadores-->
  <ng-container *ngIf="errors as e; else semErroDeValidacao">
    <span class="error" *ngIf="e['required']">{{ errorRequired }}</span>
    <span class="error" *ngIf="e['email']">{{ errorEmail }}</span>
    <span class="error" *ngIf="e['minlength']">
      {{ errorMin || 'Mínimo de ' + e['minlength'].requiredLength + ' caracteres.' }}
    </span>
    <span class="error" *ngIf="e['maxlength']">
      {{ errorMax || 'Máximo de ' + e['maxlength'].requiredLength + ' caracteres.' }}
    </span>
    <span class="error" *ngIf="e['pattern']">{{ errorPattern }}</span>
  </ng-container>

  <ng-template #semErroDeValidacao>
    <span class="error" *ngIf="error">{{ error }}</span>
  </ng-template>

  <div class="footer" *ngIf="hint || maxLength">
    <span class="hint">{{ hint }}</span>
    <span class="counter" *ngIf="maxLength">{{ currentLength }} / {{ maxLength }}</span>
  </div>
</div>
