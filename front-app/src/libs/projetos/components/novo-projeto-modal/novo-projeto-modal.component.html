<div class="modal">
  <div class="modal-header">
    <h2>Criar Novo Projeto</h2>
    <button class="close-btn" type="button" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <form [formGroup]="form" class="modal-form" (ngSubmit)="criar()">
    <app-input-field
      label="Nome do Projeto"
      placeholder="Ex: Campanha Verão 2026"
      formControlName="nome"
      errorRequired="Informe o nome do projeto."
    >
    </app-input-field>

    <div class="select-field">
      <label>Cliente</label>
      <select formControlName="clienteId">
        <option value="" disabled>{{ clientes.length ? 'Selecione um cliente' : 'Nenhum cliente cadastrado' }}</option>
        <option *ngFor="let c of clientes" [value]="c.id">{{ c.nome }} ({{ c.email }})</option>
      </select>
      <span class="field-error" *ngIf="clienteId.touched && clienteId.invalid">Selecione o cliente.</span>
      <span class="field-hint" *ngIf="!clientes.length">Cadastre o cliente na tela Clientes antes de criar o projeto.</span>
    </div>

    <div class="select-field">
      <label>Editor Responsável</label>
      <select formControlName="editorId">
        <option value="" disabled>Selecione um editor</option>
        <option *ngFor="let e of editores" [value]="e.id">{{ e.nome }}</option>
      </select>
      <span class="field-error" *ngIf="editorId.touched && editorId.invalid">Selecione o editor responsável.</span>
    </div>

    <app-input-field
      label="Prazo"
      type="date"
      formControlName="prazo"
      errorRequired="Informe o prazo."
    >
    </app-input-field>

    <app-input-field
      label="Descrição"
      type="textarea"
      placeholder="Breve descrição do projeto"
      formControlName="descricao"
    >
    </app-input-field>

    <app-primary-button label="Criar Projeto" type="submit" [loading]="loading"></app-primary-button>
  </form>
</div>
